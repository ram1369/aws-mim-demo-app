AWSTemplateFormatVersion: '2010-09-09'
Description: 'Customer Portal Cache - Migration to Multi-AZ'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIdAZa:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in us-east-1a
  SubnetIdAZb:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in us-east-1b

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Cache subnet group - Multi-AZ
      SubnetIds:
        - !Ref SubnetIdAZa
        - !Ref SubnetIdAZb

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis cache security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.0.0/16

  # EXISTING: Keep until consumers cut over
  PortalCache:
    Type: AWS::ElastiCache::CacheCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      CacheNodeType: cache.t3.medium
      Engine: redis
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt CacheSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: portal-cache-legacy
        - Key: Workload
          Value: customer-portal

  # NEW: Multi-AZ ReplicationGroup
  PortalCacheMultiAZ:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: Customer Portal Redis - Multi-AZ
      Engine: redis
      CacheNodeType: cache.t3.medium
      NumCacheClusters: 2
      MultiAZEnabled: true
      AutomaticFailoverEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !GetAtt CacheSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: portal-cache
        - Key: Workload
          Value: customer-portal

Outputs:
  # Old endpoint (consumers still using this)
  LegacyCacheEndpoint:
    Value: !GetAtt PortalCache.RedisEndpoint.Address
  # New endpoint (consumers should migrate to this)
  CacheEndpoint:
    Value: !GetAtt PortalCacheMultiAZ.PrimaryEndPoint.Address
  CachePort:
    Value: !GetAtt PortalCacheMultiAZ.PrimaryEndPoint.Port
